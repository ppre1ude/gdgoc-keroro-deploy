<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>GDGoC CNU 프로젝트 팀 모집</title>
  <link rel="icon" href="/gdgoc-keroro-deploy/assets/gdgoc.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&display=swap">
  <style>
    :root {
      --green-900: #14532d;
      --green-700: #1e7a3c;
      --green-600: #2e9e4f;
      --green-500: #3fb95a;
      --green-100: #dff5e3;
      --yellow-dark: #b8930a;
      --red: #e5484d;
      --ink: #16261b;
      --muted: #55675c;
      --line: #cfe0d3;
    }

    * { box-sizing: border-box; }
    .hidden { display: none !important; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      color: var(--ink);
      background-color: #f1f8f2;
      background-image:
        radial-gradient(rgb(20 83 45 / 9%) 1.5px, transparent 1.6px),
        linear-gradient(160deg, #e4f5e6 0%, #f7fcf6 55%, #fff9d9 100%);
      background-size: 18px 18px, 100% 100%;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid var(--green-100);
      border-top-color: var(--green-600);
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .gate { width: min(420px, 100%); }

    .squad {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 6px;
      height: 80px;
      margin: 0 0 14px;
    }

    .squad img {
      height: 64px;
      filter: drop-shadow(0 4px 0 rgb(0 0 0 / 8%));
      transition: transform 200ms ease;
    }

    .squad img:nth-child(1) { transform: rotate(-8deg); }
    .squad img:nth-child(2) { height: 76px; }
    .squad img:nth-child(3) { transform: rotate(8deg); }
    .gate:focus-within .squad img:nth-child(2) { transform: translateY(-4px); }

    .card {
      padding: 28px 32px 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 4px 0 rgb(20 83 45 / 6%), 0 24px 48px rgb(20 83 45 / 10%);
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 10px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--green-100);
      color: var(--green-900);
      font-size: 11px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-family: Sora, Pretendard, sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.35;
    }

    h1 strong {
      display: block;
      background: linear-gradient(120deg, var(--green-600) 10%, var(--green-900) 90%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-size: 30px;
    }

    h1 em { color: var(--yellow-dark); font-size: 0.72em; font-style: normal; }

    .instructions {
      margin: 12px 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #fbfdfb;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .field:focus-within {
      border-color: var(--green-500);
      box-shadow: 0 0 0 4px rgb(63 185 90 / 15%);
    }

    .field.invalid {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgb(214 64 69 / 12%);
      animation: shake 320ms ease;
    }

    @keyframes shake {
      25% { transform: translateX(-6px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    .field input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
    }

    .toggle {
      margin-right: 6px;
      padding: 6px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .toggle:hover { background: var(--green-100); color: var(--green-900); }

    .error {
      margin: 8px 2px 0;
      color: var(--red);
      font-size: 13px;
      font-weight: 600;
      text-align: left;
    }

    .submit {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--green-600);
      box-shadow: 0 3px 0 var(--green-900);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background 150ms ease, transform 100ms ease, box-shadow 100ms ease;
    }

    .submit:hover { background: var(--green-700); }
    .submit:active { transform: translateY(3px); box-shadow: 0 0 0 var(--green-900); }
    .submit:disabled { background: #9fc9ab; box-shadow: none; cursor: wait; }

    .foot {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .foot img { width: 18px; height: 18px; }

    @media (prefers-reduced-motion: reduce) {
      .spinner, .field.invalid { animation: none; }
      .squad img, .submit { transition: none; }
    }
  </style>
</head>
